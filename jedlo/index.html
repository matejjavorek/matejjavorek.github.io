<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jedlo</title>
<meta name="description" content="Denník stravovania, kalórie, makrá, voda, váha a rozpoznanie jedla z fotky.">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jedlo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="day">
      <div class="day-row">
        <h1 id="title">Dnes</h1>
        <button class="round sm" id="prev-day" aria-label="Predošlý deň"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="round sm" id="next-day" aria-label="Ďalší deň"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <p class="date" id="date"></p>
      <p class="nd" id="nameday"></p>
    </div>
    <button class="avatar" id="open-profile" aria-label="Profil">?</button>
  </header>
  <main id="page"></main>
</div>

<button class="fab" data-act="add" aria-label="Pridať jedlo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="sheet-bg" id="sheet-bg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <button class="round sm" id="sheet-back" aria-label="Späť" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="sheet-title"></h2>
      <button class="round sm" id="close-sheet" aria-label="Zavrieť"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
<input type="file" id="import-input" accept="application/json" hidden>
<div class="cook-mode" id="cook-mode" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="meniny.js?v=14"></script>
<script src="app.js?v=14"></script>
</body>
</html>
